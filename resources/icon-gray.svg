<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景グラデーション -->
    <radialGradient id="bgGlowGray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="100%" stop-color="#101014"/>
    </radialGradient>

    <!-- ネオン発光用フィルター -->
    <filter id="glowGray" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="brightGlowGray" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="rayGradientGray" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#808080"/>
      <stop offset="70%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- アイコンベース背景 -->
  <rect width="128" height="128" rx="24" fill="url(#bgGlowGray)"/>

  <!-- 光るグラフ線 -->
  <g filter="url(#glowGray)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 32 100 L 32 28" stroke="#a0a0a0" stroke-width="4"/>
    <path d="M 32 80 C 48 80, 52 60, 52 48 L 52 36" stroke="#707070" stroke-width="4"/>
    <path d="M 32 80 L 68 64 L 88 44" stroke="#888888" stroke-width="4"/>
    <path d="M 52 48 L 88 44 L 108 20" stroke="url(#rayGradientGray)" stroke-width="5"/>
    <path d="M 88 44 L 118 24" stroke="#c0c0c0" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- コミットノード -->
  <g filter="url(#glowGray)">
    <circle cx="32" cy="100" r="5" fill="#101014" stroke="#a0a0a0" stroke-width="3"/>
    <circle cx="32" cy="64" r="5" fill="#101014" stroke="#a0a0a0" stroke-width="3"/>
    <circle cx="32" cy="28" r="5" fill="#101014" stroke="#a0a0a0" stroke-width="3"/>

    <circle cx="52" cy="48" r="5" fill="#101014" stroke="#707070" stroke-width="3"/>
    <circle cx="68" cy="64" r="5" fill="#101014" stroke="#a0a0a0" stroke-width="3"/>

    <circle cx="88" cy="44" r="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="3" filter="url(#brightGlowGray)"/>
  </g>

  <!-- Rayフレア効果 -->
  <g filter="url(#brightGlowGray)">
    <path d="M 88 24 L 88 64 M 68 44 L 108 44" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <circle cx="88" cy="44" r="3" fill="#ffffff"/>
  </g>
</svg>
